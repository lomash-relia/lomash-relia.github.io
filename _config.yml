# ----------------------------------------
# Site Settings
# ----------------------------------------

title: "Lomash Relia"
email: "lomashrelia@gmail.com"

description: >-
  Portfolio of Lomash Relia, M.Tech student in Autonomous Systems and Machine Intelligence.
  Focused on robotics research, autonomous systems, computer vision, deep learning,
  and edge AI. This site presents research work, technical projects, publications,
  and professional experience.

github_username: "lomash-relia"

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "air"

search: true

# ----------------------------------------
# Build Settings
# ----------------------------------------

markdown: kramdown
permalink: /:categories/:title/
timezone: "Asia/Kolkata"

include:
  - _pages
  - _projects
  - _portfolio

# ----------------------------------------
# Plugins (GitHub Pages compatible)
# ----------------------------------------

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-gist
  - jemoji
  - jekyll-include-cache

# ----------------------------------------
# Author Information
# ----------------------------------------

author:
  name: "Lomash Relia"
  avatar: "/assets/images/bio-photo.jpg"
  bio: >-
    M.Tech student and robotics researcher specializing in autonomous systems,
    space robotics, computer vision, deep learning, and edge AI.

  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:lomashrelia@gmail.com"

    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/lomash-relia/"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lomash-relia"

    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=jX94zWoAAAAJ&hl=en"

    - label: "Supervisor"
      icon: "fas fa-fw fa-university"
      url: "https://www.iiitm.ac.in/index.php/en/component/splms/teacher/Dr.Somesh"

# ----------------------------------------
# Footer Links
# ----------------------------------------

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/lomash-relia/"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lomash-relia"

    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=jX94zWoAAAAJ&hl=en"

    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:lomashrelia@gmail.com"

# ----------------------------------------
# Page Defaults
# ----------------------------------------

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true

  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# ----------------------------------------
# Archive Settings
# ----------------------------------------

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/
