# ----------------------------------------
# Site settings
# ----------------------------------------

title: "Lomash Relia"
email: "lomashrelia@gmail.com"
description: >-
  Portfolio of Lomash Relia, a graduate researcher in Autonomous Systems and Robotics.
  This website presents research work, projects, professional experience, and publications.

github_username: "lomash-relia"

# Minimal Mistakes theme
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dark"

# Search
search: true

# Build settings
markdown: kramdown
permalink: /:categories/:title/
timezone: "Asia/Kolkata"

# Include custom collections
include:
  - _pages
  - _projects

# ----------------------------------------
# Plugins
# ----------------------------------------

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-gist
  - jemoji
  - jekyll-include-cache

# ----------------------------------------
# Author details
# ----------------------------------------

author:
  name: "Lomash Relia"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Graduate student and robotics researcher specializing in autonomous systems, perception, and control."
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:lomashrelia@gmail.com"

    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/lomash-relia/"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lomash-relia"

    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=jX94zWoAAAAJ&hl=en"

# ----------------------------------------
# Footer links
# ----------------------------------------

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/lomash-relia/"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lomash-relia"

    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=jX94zWoAAAAJ&hl=en"

    - label: "Springer Publication"
      icon: "fas fa-fw fa-book"
      url: "https://link.springer.com/chapter/10.1007/978-981-96-3420-0_17"

    - label: "WGNE Blue Book"
      icon: "fas fa-fw fa-file-alt"
      url: "https://wgne.net/bluebook/uploads/2024/docs/010_Relia,_Lomash_Evaluating_Deep_Learning_Models_for_Cyclone_Intensity_Estimation.pdf"

# ----------------------------------------
# Page defaults
# ----------------------------------------

defaults:
  # Posts (if used later)
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true

  # Pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# ----------------------------------------
# Archive configuration
# ----------------------------------------

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/
